services:
  postgres-db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - shorturl_postgres-data:/var/lib/postgresql/data

  url-shortener:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/url-shortener
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    develop:
      watch:
        - action: rebuild
          path: .

volumes:
  shorturl_postgres-data:
